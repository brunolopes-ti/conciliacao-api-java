spring.application.name=conciliacao-api-java

conciliacao.api.execucao-habilitada=${CONCILIACAO_API_EXECUCAO_HABILITADA:false}

conciliacao.persistencia.habilitada=${CONCILIACAO_PERSISTENCIA_HABILITADA:true}

conciliacao.cobol.executavel=${CONCILIACAO_COBOL_EXECUTAVEL:}
conciliacao.cobol.timeout-ms=${CONCILIACAO_COBOL_TIMEOUT_MS:30000}
conciliacao.cobol.max-concorrencia=${CONCILIACAO_COBOL_MAX_CONCORRENCIA:1}

spring.datasource.url=${CONCILIACAO_DB_URL}
spring.datasource.username=${CONCILIACAO_DB_USER}
spring.datasource.password=${CONCILIACAO_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${CONCILIACAO_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${CONCILIACAO_DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${CONCILIACAO_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${CONCILIACAO_DB_VALIDATION_TIMEOUT_MS:3000}

spring.flyway.enabled=${CONCILIACAO_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${CONCILIACAO_FLYWAY_URL:${CONCILIACAO_DB_URL}}
spring.flyway.user=${CONCILIACAO_FLYWAY_USER}
spring.flyway.password=${CONCILIACAO_FLYWAY_PASSWORD}
spring.flyway.baseline-on-migrate=${CONCILIACAO_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.sql.init.mode=never


conciliacao.cobol.espera-vaga-ms=${CONCILIACAO_COBOL_ESPERA_VAGA_MS:1000}

# revisao-operacional-timeouts
# connection-timeout do Hikari limita a obtencao de conexao, nao locks/queries.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '${CONCILIACAO_DB_LOCK_TIMEOUT_MS:5000}ms'
spring.jdbc.template.query-timeout=${CONCILIACAO_DB_QUERY_TIMEOUT:15s}

conciliacao.recuperacao.habilitada=${CONCILIACAO_RECUPERACAO_HABILITADA:true}
conciliacao.recuperacao.idade-minima-ms=${CONCILIACAO_RECUPERACAO_IDADE_MINIMA_MS:300000}
conciliacao.recuperacao.intervalo-ms=${CONCILIACAO_RECUPERACAO_INTERVALO_MS:60000}
conciliacao.recuperacao.atraso-inicial-ms=${CONCILIACAO_RECUPERACAO_ATRASO_INICIAL_MS:10000}
conciliacao.recuperacao.temporarios-idade-minima-ms=${CONCILIACAO_RECUPERACAO_TEMPORARIOS_IDADE_MINIMA_MS:1800000}
